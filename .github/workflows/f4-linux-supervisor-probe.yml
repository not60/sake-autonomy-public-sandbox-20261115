name: F4 Linux Supervisor Probe (Test Only)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/f4-linux-supervisor-probe.yml"
      - "tools/f4_linux_supervisor_probe.py"
      - "tests/test_f4_linux_supervisor_probe.py"

permissions:
  contents: read

jobs:
  isolated-process-observation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Check out without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Pull the pinned test-only Ubuntu image
        run: docker pull --platform linux/amd64 amd64/ubuntu@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
      - name: Observe the fixed unprivileged probe only
        env:
          F4_RUN_DOCKER_PROBE: "1"
          F4_PROBE_IMAGE: amd64/ubuntu@sha256:78d4744ead1f5b19b04d0df558ab182a5300903900755e515b2ca4d10eb2044d
        run: python3 -m unittest discover -s tests -p 'test_f4_linux_supervisor_probe.py' -v
