name: Public Runner DRAFT_HOLD (manual, disabled)

on:
  workflow_dispatch:

permissions: {}

jobs:
  worker:
    # Hard stop: this local candidate cannot start Codex or a Worker.
    if: ${{ false && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the dispatch revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned verification dependency
        run: python -m pip install --disable-pip-version-check -r ops/command-tower/requirements-publisher.txt
      - name: Require an existing Worker-only Codex credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo 'HOLD: Worker-only Codex credential is not configured.' >&2
            exit 78
          fi
      - name: Codex candidate generation
        # Defense in depth: never invoke the Worker from this unsigned draft.
        if: ${{ false }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: .
          sandbox: workspace-write
          output-file: ${{ runner.temp }}/codex-final-message.txt
          prompt: |
            This workflow remains DRAFT_HOLD. Read the local public runner
            backlog. If it is unsigned or not SIGNED_GO, stop without editing
            files. Do not call GitHub APIs or perform publication.
      - name: Package exact candidate bytes and hash manifest
        run: |
          set -euo pipefail
          allowed_paths=(
            ops/command-tower/policy-public-runner.draft.json
            ops/command-tower/runtime-public-runner.draft.json
            ops/command-tower/backlog-public-runner.draft.json
            ops/command-tower/test_public_runner_draft_contract.py
            ops/command-tower/isolated_runtime.py
            ops/command-tower/test_isolated_runtime.py
            ops/command-tower/durable_store.py
            ops/command-tower/test_durable_store.py
            ops/command-tower/test_process_crash_recovery.py
            ops/command-tower/publisher_gate.py
            ops/command-tower/runner_artifact.py
            ops/command-tower/cas_journal.py
            ops/command-tower/attestations.py
            ops/command-tower/requirements-publisher.txt
            ops/command-tower/test_cas_journal.py
            ops/command-tower/test_durable_permit_identity.py
            ops/command-tower/test_publisher_gate.py
            ops/command-tower/test_publisher_gate_crypto.py
            ops/command-tower/test_runner_artifact.py
          )
          args=()
          for path in "${allowed_paths[@]}"; do args+=(--allowed-path "$path"); done
          python ops/command-tower/runner_artifact.py \
            --worktree-root "$GITHUB_WORKSPACE" \
            --output-root "$RUNNER_TEMP/b09-bundle" \
            --repository-id 1458303357 \
            --base-sha "$GITHUB_SHA" \
            --worker-run-id "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --codex-output-file "$RUNNER_TEMP/codex-final-message.txt" \
            "${args[@]}"
      - name: Transfer the untrusted candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: b09-public-runner-candidate
          path: ${{ runner.temp }}/b09-bundle/
          if-no-files-found: error
          retention-days: 1

  publisher:
    needs: worker
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
      pr_head_sha: ${{ steps.publish.outputs.pr_head_sha }}
      pr_base_sha: ${{ steps.publish.outputs.pr_base_sha }}
    # Hard stop. This role is only a permission candidate; it has no write step.
    if: ${{ false && needs.worker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: none
    steps:
      - name: Check out the same dispatch revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned verification dependency
        run: python -m pip install --disable-pip-version-check -r ops/command-tower/requirements-publisher.txt
      - name: Download worker bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: b09-public-runner-candidate
          path: ${{ runner.temp }}/b09-bundle
      - name: Verify exact bytes, Permit, Witness, and durable single use
        id: publish
        env:
          B09_CAS_ENDPOINT: ${{ vars.B09_CAS_ENDPOINT }}
          B09_CAS_TOKEN: ${{ secrets.B09_CAS_TOKEN }}
          B09_PUBLISHER_GITHUB_TOKEN: ${{ secrets.B09_PUBLISHER_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '{"keys":[]}\n' > "$RUNNER_TEMP/b09-empty-trusted-keys.json"
          allowed_paths=(
            ops/command-tower/policy-public-runner.draft.json
            ops/command-tower/runtime-public-runner.draft.json
            ops/command-tower/backlog-public-runner.draft.json
            ops/command-tower/test_public_runner_draft_contract.py
            ops/command-tower/isolated_runtime.py
            ops/command-tower/test_isolated_runtime.py
            ops/command-tower/durable_store.py
            ops/command-tower/test_durable_store.py
            ops/command-tower/test_process_crash_recovery.py
            ops/command-tower/publisher_gate.py
            ops/command-tower/runner_artifact.py
            ops/command-tower/cas_journal.py
            ops/command-tower/attestations.py
            ops/command-tower/requirements-publisher.txt
            ops/command-tower/test_cas_journal.py
            ops/command-tower/test_durable_permit_identity.py
            ops/command-tower/test_publisher_gate.py
            ops/command-tower/test_publisher_gate_crypto.py
            ops/command-tower/test_runner_artifact.py
          )
          args=()
          for path in "${allowed_paths[@]}"; do args+=(--allowed-path "$path"); done
          result="$(python ops/command-tower/publisher_gate.py \
            --artifact-root "$RUNNER_TEMP/b09-bundle/files" \
            --manifest "$RUNNER_TEMP/b09-bundle/manifest.json" \
            --permit "$RUNNER_TEMP/b09-bundle/permit.json" \
            --witness "$RUNNER_TEMP/b09-bundle/witness.json" \
            --codex-output "$RUNNER_TEMP/b09-bundle/evidence/codex-output.bin" \
            --owner-approvals "$RUNNER_TEMP/b09-bundle/owner-approvals.json" \
            --trusted-keys "$RUNNER_TEMP/b09-empty-trusted-keys.json" \
            --database "$RUNNER_TEMP/publisher-journal.sqlite3" \
            --repository-id 1458303357 \
            --base-sha "$GITHUB_SHA" \
            --cas-endpoint "${B09_CAS_ENDPOINT:-}" \
            --role publisher \
            --draft-pr-write \
            "${args[@]}")"
          printf '%s\n' "$result"
          if [[ "$result" =~ ^DRAFT_PR_CREATED:([0-9]+):([0-9a-f]{40}):([0-9a-f]{40}):https://github\.com/not60/sake-autonomy-public-sandbox-20261115/pull/[0-9]+$ ]]; then
            printf 'pr_number=%s\n' "${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            printf 'pr_head_sha=%s\n' "${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            printf 'pr_base_sha=%s\n' "${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"
          else
            echo 'HOLD: publisher did not return a validated Draft PR reference.' >&2
            exit 78
          fi

  auditor:
    needs: [worker, publisher]
    # Hard stop. Independent verification is wired but not started in DRAFT_HOLD.
    if: ${{ false && needs.worker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Check out the same dispatch revision without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned verification dependency
        run: python -m pip install --disable-pip-version-check -r ops/command-tower/requirements-publisher.txt
      - name: Independently download the original worker bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: b09-public-runner-candidate
          path: ${{ runner.temp }}/b09-bundle
      - name: Independently verify hashes and signed attestations
        env:
          B09_CAS_ENDPOINT: ${{ vars.B09_CAS_ENDPOINT }}
          B09_CAS_READ_TOKEN: ${{ secrets.B09_CAS_READ_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          B09_PR_NUMBER: ${{ needs.publisher.outputs.pr_number }}
          B09_PR_HEAD_SHA: ${{ needs.publisher.outputs.pr_head_sha }}
          B09_PR_BASE_SHA: ${{ needs.publisher.outputs.pr_base_sha }}
        run: |
          set -euo pipefail
          printf '{"keys":[]}\n' > "$RUNNER_TEMP/b09-empty-trusted-keys.json"
          allowed_paths=(
            ops/command-tower/policy-public-runner.draft.json
            ops/command-tower/runtime-public-runner.draft.json
            ops/command-tower/backlog-public-runner.draft.json
            ops/command-tower/test_public_runner_draft_contract.py
            ops/command-tower/isolated_runtime.py
            ops/command-tower/test_isolated_runtime.py
            ops/command-tower/durable_store.py
            ops/command-tower/test_durable_store.py
            ops/command-tower/test_process_crash_recovery.py
            ops/command-tower/publisher_gate.py
            ops/command-tower/runner_artifact.py
            ops/command-tower/cas_journal.py
            ops/command-tower/attestations.py
            ops/command-tower/requirements-publisher.txt
            ops/command-tower/test_cas_journal.py
            ops/command-tower/test_durable_permit_identity.py
            ops/command-tower/test_publisher_gate.py
            ops/command-tower/test_publisher_gate_crypto.py
            ops/command-tower/test_runner_artifact.py
          )
          args=()
          for path in "${allowed_paths[@]}"; do args+=(--allowed-path "$path"); done
          python ops/command-tower/publisher_gate.py \
            --artifact-root "$RUNNER_TEMP/b09-bundle/files" \
            --manifest "$RUNNER_TEMP/b09-bundle/manifest.json" \
            --permit "$RUNNER_TEMP/b09-bundle/permit.json" \
            --witness "$RUNNER_TEMP/b09-bundle/witness.json" \
            --codex-output "$RUNNER_TEMP/b09-bundle/evidence/codex-output.bin" \
            --owner-approvals "$RUNNER_TEMP/b09-bundle/owner-approvals.json" \
            --trusted-keys "$RUNNER_TEMP/b09-empty-trusted-keys.json" \
            --database "$RUNNER_TEMP/auditor-journal.sqlite3" \
            --repository-id 1458303357 \
            --base-sha "$GITHUB_SHA" \
            --cas-endpoint "${B09_CAS_ENDPOINT:-}" \
            --role auditor \
            --audit-pr-ci \
            --pull-request-number "$B09_PR_NUMBER" \
            --expected-pr-head-sha "$B09_PR_HEAD_SHA" \
            --expected-pr-base-sha "$B09_PR_BASE_SHA" \
            "${args[@]}"
