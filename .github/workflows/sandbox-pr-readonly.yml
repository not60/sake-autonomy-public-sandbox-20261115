name: Sandbox PR Read-Only Guard

on:
  pull_request:
    branches:
      - main
    paths:
      - "ops/command-tower/**"
      - ".github/workflows/sandbox-pr-readonly.yml"

permissions:
  contents: read

jobs:
  sandbox-fixture-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - name: Check out pull request without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Install pinned Deno runtime
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.8
      - name: Install the pinned Ed25519 verification dependency
        run: python3 -m pip install --disable-pip-version-check -r ops/command-tower/requirements-publisher.txt
      - name: Run sandbox-only read-only tests
        run: python3 -m unittest discover -s ops/command-tower -p 'test_*.py' -v
      - name: Run isolated PostgreSQL and Deno integration candidate
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: supabase_admin
          PGADMINUSER: supabase_admin
          PGDATABASE: postgres
        run: bash ops/command-tower/supabase-cas-draft/tests/run_isolated_postgres_candidate.sh
